name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dashboard,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (serves the committed real-data results)
        run: docker build -t vol-var-india .
      - name: Smoke-test the API container
        run: |
          docker run -d --name volvar -p 8000:8000 vol-var-india
          for i in $(seq 1 30); do
            curl -fs localhost:8000/health && break || sleep 2
          done
          curl -fs localhost:8000/health | grep '"dataset":"real"'
          curl -fs localhost:8000/portfolio > /dev/null || echo "portfolio results not generated yet"
          curl -fs -X POST localhost:8000/assistant \
            -H 'content-type: application/json' \
            -d '{"question": "Which model has the lowest QLIKE?"}' | grep '"grounded":true'
          docker rm -f volvar
