name: Daily risk refresh

# Rebuilds every result from fresh market data after the NSE close and commits what changed:
# results/*.csv|json, the README headline, snapshot and results blocks (figures on Fridays).
on:
  schedule:
    - cron: "45 12 * * 1-5" # 18:15 IST, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data]"

      - name: Download daily prices (Yahoo Finance via yfinance)
        run: python scripts/fetch_data.py --out data/raw

      - name: Check the download is complete and current
        run: |
          python - <<'PY'
          import glob, sys
          import pandas as pd
          files = sorted(glob.glob("data/raw/*.csv"))
          if len(files) < 16:
              sys.exit(f"expected 16 price files, got {len(files)}; not committing anything")
          last = max(pd.to_datetime(pd.read_csv(f)["Date"]).max() for f in files)
          age = (pd.Timestamp.now().normalize() - last.normalize()).days
          print(f"{len(files)} files, latest close {last.date()} ({age} days old)")
          if age > 7:
              sys.exit("prices are more than a week old; not committing anything")
          PY

      - name: Walk-forward study on real data
        run: python scripts/run_pipeline.py --data-dir data/raw --results-dir results --label real --n-jobs 4

      - name: Assistant regression evaluation
        run: python scripts/eval_assistant.py --results-dir results --out results/assistant_eval.json

      - name: Rewrite README numbers from results/
        run: python scripts/update_readme.py

      - name: Commit refreshed results
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Keep the history small: re-render figures only on Fridays and on manual runs.
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%u)" != "5" ]; then
            git checkout -- results/figures 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          DATA_END=$(python -c "import json; print(json.load(open('results/meta.json'))['data_end'])")
          git commit -m "data: daily risk refresh (prices to ${DATA_END})"
          git push
